spring:
  application:
    name: guman

server:
  port: ${SERVER_PORT:8080}

agentscope:
  model:
    provider: dashscope
  dashscope:
    api-key: ${DASHSCOPE_API_KEY:}
    model-name: ${DASHSCOPE_MODEL:qwen-plus}
    stream: true

guman:
  agent:
    workspace: ${AGENTSCOPE_WORKSPACE:.agentscope/workspace}

management:
  endpoints:
    web:
      exposure:
        include: health,info
