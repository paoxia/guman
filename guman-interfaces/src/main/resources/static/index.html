<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f7f8">
  <title>Guman</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app-shell">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <aside class="sidebar" id="sidebar" aria-label="会话侧栏">
      <div class="sidebar-brand">
        <a class="brand" href="/" aria-label="Guman 首页">
          <span class="brand-mark">G</span>
          <span>Guman</span>
        </a>
        <button class="icon-button sidebar-close" id="sidebarClose" type="button" aria-label="关闭侧栏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>

      <button class="new-chat-button" id="newChatButton" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
        <span>新建对话</span>
        <kbd>Ctrl K</kbd>
      </button>

      <div class="history-heading">最近对话</div>
      <nav class="conversation-list" id="conversationList" aria-label="最近对话"></nav>

      <div class="sidebar-footer">
        <div class="profile-avatar">U</div>
        <div class="profile-copy">
          <strong>本地用户</strong>
          <span>本地会话</span>
        </div>
        <span class="online-dot" title="服务在线"></span>
      </div>
    </aside>

    <main class="chat-panel">
      <header class="topbar">
        <button class="icon-button mobile-menu" id="mobileMenu" type="button" aria-label="打开侧栏">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="product-name">Guman</div>
        <div class="topbar-actions">
          <span class="connection-status" id="connectionStatus">
            <span class="status-dot"></span>
            <span class="status-label">Ready</span>
          </span>
        </div>
      </header>

      <section class="conversation" id="conversation" aria-live="polite">
        <div class="empty-state" id="emptyState">
          <div class="hero-mark">
            <span>G</span>
            <i></i>
          </div>
          <h1>今天想一起完成什么？</h1>
          <p>和你的智能助手聊聊想法、代码或任何正在推进的事情。</p>
          <div class="suggestion-grid">
            <button class="suggestion-card" type="button" data-prompt="帮我分析一下这个项目的整体架构，并提出三个改进建议。">
              <span class="suggestion-icon violet">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 7v5c0 4.6 3.2 7.7 8 9 4.8-1.3 8-4.4 8-9V7l-8-4Z"/><path d="m9 12 2 2 4-4"/></svg>
              </span>
              <strong>分析项目架构</strong>
              <span>梳理模块并寻找改进空间</span>
            </button>
            <button class="suggestion-card" type="button" data-prompt="为这个产品脑暴五个有潜力的新功能，并说明用户价值。">
              <span class="suggestion-icon amber">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 22h4M8.5 14.5A7 7 0 1 1 15.5 14.5c-.9.7-1.5 1.8-1.5 3h-4c0-1.2-.6-2.3-1.5-3Z"/></svg>
              </span>
              <strong>脑暴产品创意</strong>
              <span>探索新功能与用户价值</span>
            </button>
            <button class="suggestion-card" type="button" data-prompt="帮我写一份简洁清晰的技术方案，包含背景、目标、方案和风险。">
              <span class="suggestion-icon green">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
              </span>
              <strong>起草技术方案</strong>
              <span>快速形成结构化文档</span>
            </button>
            <button class="suggestion-card" type="button" data-prompt="请检查我接下来发给你的代码，重点关注正确性、性能和安全问题。">
              <span class="suggestion-icon blue">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 9-4 3 4 3M16 9l4 3-4 3M14 5l-4 14"/></svg>
              </span>
              <strong>审查一段代码</strong>
              <span>定位问题并给出修改建议</span>
            </button>
          </div>
        </div>

        <div class="message-list" id="messageList"></div>
      </section>

      <footer class="composer-area">
        <form class="composer" id="composer">
          <textarea id="messageInput" rows="1" maxlength="20000" placeholder="给 Guman 发消息" aria-label="消息内容"></textarea>
          <div class="attachment-preview-list" id="attachmentPreviewList" aria-live="polite"></div>
          <div class="composer-toolbar">
            <div class="composer-tools">
              <button class="tool-button" id="attachmentButton" type="button" aria-label="添加附件" title="添加图片、文本或 PDF">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 5-6.5 6.5a4 4 0 0 0 5.7 5.7l7.1-7.1a2.8 2.8 0 1 0-4-4l-7 7a1.6 1.6 0 0 0 2.3 2.3l6.4-6.4"/></svg>
              </button>
              <input id="attachmentInput" type="file" multiple hidden
                     accept="image/png,image/jpeg,image/webp,application/pdf,.txt,.md,.markdown,.csv,.json,.xml,.yaml,.yml,.java,.kt,.js,.ts,.jsx,.tsx,.py,.go,.rs,.c,.h,.cpp,.hpp,.html,.css,.scss,.sql,.sh,.bash,.zsh,.properties,.toml,.ini,.log">
              <span class="composer-hint">Enter 发送 · Shift + Enter 换行</span>
            </div>
            <button class="send-button" id="sendButton" type="submit" aria-label="发送消息" disabled>
              <svg class="send-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/></svg>
              <span class="stop-icon" aria-hidden="true"></span>
            </button>
          </div>
        </form>
        <p class="disclaimer">Guman 可能会犯错，请核查重要信息。</p>
      </footer>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <script src="/app.js" defer></script>
</body>
</html>
